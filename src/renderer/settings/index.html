<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="window.title"></title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="window-frame">
    <div class="titlebar">
      <div class="titlebar__dots">
        <button id="win-min" class="dot dot--amber" data-i18n-label="window.minimize" type="button"></button>
        <button id="win-max" class="dot dot--green" data-i18n-label="window.maximize" type="button"></button>
        <button id="win-close" class="dot dot--red" data-i18n-label="window.close" type="button"></button>
      </div>
    </div>

    <div class="app-shell">
      <nav class="sidebar">
        <div class="sidebar__brand">
          <span class="sidebar__led" aria-hidden="true"></span>
          <span>murmur</span>
        </div>
        <ul class="nav-list" role="tablist">
          <li class="nav-item is-active" data-section="home" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
            <span data-i18n="nav.home"></span>
          </li>
          <li class="nav-item" data-section="general" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H3" /><path d="M12 19H3" /><path d="M14 3v4" /><path d="M16 17v4" /><path d="M21 12h-9" /><path d="M21 19h-5" /><path d="M21 5h-7" /><path d="M8 10v4" /><path d="M8 12H3" /></svg>
            <span data-i18n="nav.general"></span>
          </li>
          <li class="nav-item" data-section="microphone" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><rect x="9" y="2" width="6" height="13" rx="3" /></svg>
            <span data-i18n="nav.microphone"></span>
          </li>
          <li class="nav-item" data-section="model" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" /><path d="M9 13a4.5 4.5 0 0 0 3-4" /><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" /><path d="M3.477 10.896a4 4 0 0 1 .585-.396" /><path d="M6 18a4 4 0 0 1-1.967-.516" /><path d="M12 13h4" /><path d="M12 18h6a2 2 0 0 1 2 2v1" /><path d="M12 8h8" /><path d="M16 8V5a2 2 0 0 1 2-2" /><circle cx="16" cy="13" r=".5" /><circle cx="18" cy="3" r=".5" /><circle cx="20" cy="21" r=".5" /><circle cx="20" cy="8" r=".5" /></svg>
            <span data-i18n="nav.model"></span>
          </li>
          <li class="nav-item" data-section="dictionary" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16" /><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" /></svg>
            <span data-i18n="nav.dictionary"></span>
          </li>
          <li class="nav-item" data-section="shortcuts" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4a1 1 0 0 1 1-1" /><path d="M15 10a1 1 0 0 1-1-1" /><path d="M21 4a1 1 0 0 0-1-1" /><path d="M21 9a1 1 0 0 1-1 1" /><path d="m3 7 3 3 3-3" /><path d="M6 10V5a2 2 0 0 1 2-2h2" /><rect x="3" y="14" width="7" height="7" rx="1" /></svg>
            <span data-i18n="nav.shortcuts"></span>
          </li>
          <li class="nav-item" data-section="hands-free" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3" /><path d="M6 6v11" /><path d="M10 3v18" /><path d="M14 8v7" /><path d="M18 5v13" /><path d="M22 10v3" /></svg>
            <span data-i18n="nav.handsFree"></span>
          </li>
          <li class="nav-item" data-section="appearance" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" /><circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /><circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /><circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /><circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /></svg>
            <span data-i18n="nav.appearance"></span>
          </li>
          <li class="nav-item" data-section="history" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></svg>
            <span data-i18n="nav.history"></span>
          </li>
          <li class="nav-item" data-section="about" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
            <span data-i18n="nav.about"></span>
          </li>
        </ul>
      </nav>

      <main class="content">
        <section id="section-home" class="pane is-active">
          <h2 data-i18n="home.title"></h2>
          <div class="stat-grid">
            <div class="stat-tile">
              <span class="stat-tile__value" id="stat-wpm">--</span>
              <span class="stat-tile__label" data-i18n="home.wpm"></span>
            </div>
            <div class="stat-tile">
              <span class="stat-tile__value" id="stat-words">--</span>
              <span class="stat-tile__label" data-i18n="home.words"></span>
            </div>
            <div class="stat-tile">
              <span class="stat-tile__value" id="stat-apps">--</span>
              <span class="stat-tile__label" data-i18n="home.apps"></span>
            </div>
            <div class="stat-tile">
              <span class="stat-tile__value" id="stat-saved">--</span>
              <span class="stat-tile__label" data-i18n="home.saved"></span>
            </div>
          </div>
          <p class="field__hint"><span data-i18n="home.hotkeyBefore"></span> <strong id="home-hotkey"></strong> <span data-i18n="home.hotkeyAfter"></span></p>
        </section>

        <section id="section-general" class="pane">
          <h2 data-i18n="general.title"></h2>
          <div class="field">
            <label for="hotkey" data-i18n="general.hotkey"></label>
            <input id="hotkey" type="text" placeholder="Control+Space" spellcheck="false" />
            <p class="field__hint" data-i18n="general.hotkeyHint"></p>
          </div>
          <label class="toggle-row">
            <span data-i18n="general.autoPaste"></span>
            <span class="toggle">
              <input id="auto-paste" type="checkbox" />
              <span class="toggle__track"><span class="toggle__thumb"></span></span>
            </span>
          </label>
          <label class="toggle-row">
            <span data-i18n="general.fullscreen"></span>
            <span class="toggle">
              <input id="disable-hotkey-fullscreen" type="checkbox" />
              <span class="toggle__track"><span class="toggle__thumb"></span></span>
            </span>
          </label>
          <label class="toggle-row">
            <span data-i18n="general.startup"></span>
            <span class="toggle">
              <input id="launch-at-startup" type="checkbox" />
              <span class="toggle__track"><span class="toggle__thumb"></span></span>
            </span>
          </label>
          <p id="launch-at-startup-hint" class="field__hint"></p>
          <div class="field">
            <label for="interface-language" data-i18n="general.language"></label>
            <select id="interface-language">
              <option value="auto" data-i18n="language.auto"></option>
              <option value="fr" lang="fr">Français</option>
              <option value="en" lang="en">English</option>
            </select>
            <p class="field__hint" data-i18n="general.languageHint"></p>
          </div>
        </section>

        <section id="section-microphone" class="pane">
          <h2 data-i18n="microphone.title"></h2>
          <div class="field">
            <label for="microphone" data-i18n="microphone.device"></label>
            <select id="microphone">
              <option value="" data-i18n="microphone.default"></option>
            </select>
            <p class="field__hint" data-i18n="microphone.deviceHint"></p>
          </div>
          <button id="detect-microphones" type="button" class="button button--ghost" data-i18n="microphone.detect"></button>
          <p id="microphone-status" class="field__hint"></p>
          <label class="toggle-row">
            <span data-i18n="microphone.keepOpen"></span>
            <span class="toggle">
              <input id="keep-microphone-open" type="checkbox" />
              <span class="toggle__track"><span class="toggle__thumb"></span></span>
            </span>
          </label>
          <p class="field__hint" data-i18n="microphone.keepOpenHint"></p>
        </section>

        <section id="section-model" class="pane">
          <h2 data-i18n="model.title"></h2>
          <div class="field">
            <label for="model" data-i18n="model.label"></label>
            <select id="model">
              <option value="large-v3-turbo" data-i18n="model.turbo"></option>
              <option value="large-v3" data-i18n="model.large"></option>
            </select>
            <p class="field__hint" data-i18n="model.hint"></p>
          </div>
        </section>

        <section id="section-dictionary" class="pane">
          <h2 data-i18n="dictionary.title"></h2>
          <p class="field__hint" data-i18n="dictionary.hint"></p>
          <div id="dictionary-list" class="dictionary-list"></div>
          <p id="dictionary-overflow" class="field__hint" data-i18n="dictionary.overflow" hidden></p>
          <button id="add-term" type="button" class="button button--ghost" data-i18n="dictionary.add"></button>
        </section>

        <section id="section-shortcuts" class="pane">
          <h2 data-i18n="shortcuts.title"></h2>
          <p class="field__hint" data-i18n="shortcuts.hint"></p>
          <div id="shortcut-list" class="dictionary-list"></div>
          <button id="add-shortcut" type="button" class="button button--ghost" data-i18n="shortcuts.add"></button>
        </section>

        <section id="section-hands-free" class="pane">
          <h2 data-i18n="handsFree.title"></h2>
          <p class="field__hint" data-i18n="handsFree.hint"></p>
          <label class="toggle-row">
            <span data-i18n="handsFree.enable"></span>
            <span class="toggle">
              <input id="hands-free-enabled" type="checkbox" />
              <span class="toggle__track"><span class="toggle__thumb"></span></span>
            </span>
          </label>
          <div class="field">
            <label for="hands-free-silence" data-i18n="handsFree.silence"></label>
            <select id="hands-free-silence">
              <option value="2"></option>
              <option value="3"></option>
              <option value="5"></option>
              <option value="8"></option>
            </select>
          </div>
          <div class="listen-status">
            <span id="hands-free-dot" class="listen-status__dot" aria-hidden="true"></span>
            <div class="listen-status__text">
              <span id="hands-free-activity" class="listen-status__label"></span>
              <span id="hands-free-last-heard" class="listen-status__heard"></span>
            </div>
          </div>
          <p class="field__hint" data-i18n="handsFree.footer"></p>
        </section>

        <section id="section-appearance" class="pane">
          <h2 data-i18n="appearance.title"></h2>
          <div class="field">
            <label for="overlay-position" data-i18n="appearance.position"></label>
            <select id="overlay-position">
              <option value="bottom-center" data-i18n="appearance.bottomCenter"></option>
              <option value="bottom-left" data-i18n="appearance.bottomLeft"></option>
              <option value="bottom-right" data-i18n="appearance.bottomRight"></option>
              <option value="top-center" data-i18n="appearance.topCenter"></option>
            </select>
          </div>
          <div class="field">
            <label data-i18n="appearance.screenColor"></label>
            <div id="accent-swatches" class="swatches"></div>
          </div>
          <label class="toggle-row">
            <span data-i18n="appearance.waveform"></span>
            <span class="toggle">
              <input id="show-waveform" type="checkbox" />
              <span class="toggle__track"><span class="toggle__thumb"></span></span>
            </span>
          </label>
        </section>

        <section id="section-history" class="pane">
          <h2 data-i18n="history.title"></h2>
          <p class="field__hint" data-i18n="history.hint"></p>
          <div id="history-list" class="history-list"></div>
          <p id="history-empty" class="field__hint" data-i18n="history.empty" hidden></p>
        </section>

        <section id="section-about" class="pane">
          <h2 data-i18n="about.title"></h2>
          <p class="about-name">murmur</p>
          <p class="field__hint" id="about-version"></p>
          <p class="field__hint" data-i18n="about.tagline"></p>
          <p class="field__hint" data-i18n="about.engine"></p>
        </section>
      </main>
    </div>

    <footer class="app-footer">
      <span id="save-status" class="save-status" role="status"></span>
      <button id="save" type="button" class="button button--primary" data-i18n="footer.save"></button>
    </footer>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
